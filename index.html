<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartner</title>
    <script>
      (function () {
        function report(kind, detail) {
          try {
            window.__TAURI_INTERNALS__.invoke("log_line", { message: kind + ": " + detail });
          } catch (x) {
            /* reporting unavailable */
          }
        }
        window.addEventListener("error", function (e) {
          report("js-error", e.message + " @ " + (e.filename || "?") + ":" + (e.lineno || 0));
        });
        window.addEventListener("unhandledrejection", function (e) {
          report("js-reject", String(e.reason));
        });
      })();
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <svg id="cat" viewBox="0 0 120 120" width="120" height="120" aria-label="Cartner the cat">
        <g id="cat-shadow">
          <ellipse cx="60" cy="112.5" rx="24" ry="3.5" fill="rgba(60,42,28,0.18)" />
        </g>
        <g id="cat-layer">
          <g id="cat-root">
            <g id="classic-cat">
            <g id="cat-tail">
              <path d="M36 88 C 20 88 14 70 26 62 C 33 57 40 63 36 70"
                fill="none" stroke="#e0913f" stroke-width="6" stroke-linecap="round" />
            </g>
            <g id="cat-body">
              <ellipse cx="60" cy="90" rx="23" ry="17" fill="#f8b45f" stroke="#d98e3b" stroke-width="1.5" />
              <ellipse class="foot foot-l" cx="50" cy="104" rx="6.5" ry="4.5" fill="#f8b45f" stroke="#d98e3b" stroke-width="1.2" />
              <ellipse class="foot foot-r" cx="70" cy="104" rx="6.5" ry="4.5" fill="#f8b45f" stroke="#d98e3b" stroke-width="1.2" />
            </g>
            <g id="cat-head">
              <path class="ear" d="M41 42 L42 22 L56 32 Z" fill="#f8b45f" stroke="#d98e3b" stroke-width="1.5" stroke-linejoin="round" />
              <path class="ear-inner" d="M45 35 L45.5 27 L52 32 Z" fill="#f9cfd1" />
              <path class="ear" d="M79 42 L78 22 L64 32 Z" fill="#f8b45f" stroke="#d98e3b" stroke-width="1.5" stroke-linejoin="round" />
              <path class="ear-inner" d="M75 35 L74.5 27 L68 32 Z" fill="#f9cfd1" />
              <circle id="cat-face" cx="60" cy="50" r="19.5" fill="#f8b45f" stroke="#d98e3b" stroke-width="1.5" />
              <g id="cat-eyes">
                <ellipse class="eye" cx="52.5" cy="48" rx="2.7" ry="3.4" fill="#3d3129" />
                <ellipse class="eye" cx="67.5" cy="48" rx="2.7" ry="3.4" fill="#3d3129" />
                <circle class="eye-glint" cx="53.6" cy="46.6" r="0.9" fill="#ffffff" />
                <circle class="eye-glint" cx="68.6" cy="46.6" r="0.9" fill="#ffffff" />
              </g>
              <path d="M57.5 54.5 L62.5 54.5 L60 57.5 Z" fill="#e77e7e" />
              <path d="M60 57.5 Q 57.5 60.5 54.5 59.5 M60 57.5 Q 62.5 60.5 65.5 59.5"
                fill="none" stroke="#3d3129" stroke-width="1.1" stroke-linecap="round" />
              <g id="cat-whiskers" stroke="rgba(61,49,41,0.65)" stroke-width="1" stroke-linecap="round">
                <line x1="40" y1="50" x2="26" y2="47.5" />
                <line x1="40" y1="53" x2="25.5" y2="53" />
                <line x1="40" y1="56" x2="27" y2="58.5" />
                <line x1="80" y1="50" x2="94" y2="47.5" />
                <line x1="80" y1="53" x2="94.5" y2="53" />
                <line x1="80" y1="56" x2="93" y2="58.5" />
              </g>
              <ellipse cx="45" cy="55" rx="3.2" ry="1.9" fill="rgba(249,167,167,0.55)" />
              <ellipse cx="75" cy="55" rx="3.2" ry="1.9" fill="rgba(249,167,167,0.55)" />
            </g>
            </g>
          </g>
        </g>
      </svg>
      <div id="cat-art" data-mood="normal" aria-hidden="true">
        <span class="strip" id="strip-idle"><img id="art-idle" src="/cat-art/idle.png" width="512" height="128" alt="" draggable="false" /></span>
        <span class="strip" id="strip-walk"><img id="art-walk" src="/cat-art/walk.png" width="896" height="128" alt="" draggable="false" /></span>
        <span class="strip" id="strip-alert"><img id="art-alert" src="/cat-art/alert.png" width="128" height="128" alt="" draggable="false" /></span>
        <span class="strip" id="strip-happy"><img id="art-happy" src="/cat-art/happy.png" width="512" height="128" alt="" draggable="false" /></span>
        <span class="strip" id="strip-eat"><img id="art-eat" src="/cat-art/eat.png" width="512" height="128" alt="" draggable="false" /></span>
        <span class="strip" id="strip-drink"><img id="art-drink" src="/cat-art/drink.png" width="256" height="128" alt="" draggable="false" /></span>
        <span class="strip" id="strip-sleepy"><img id="art-sleepy" src="/cat-art/sleepy.png" width="512" height="128" alt="" draggable="false" /></span>
        <span class="strip" id="strip-grumpy"><img id="art-grumpy" src="/cat-art/grumpy.png" width="128" height="128" alt="" draggable="false" /></span>
        <span class="strip" id="strip-sad"><img id="art-sad" src="/cat-art/sad.png" width="384" height="128" alt="" draggable="false" /></span>
      </div>
      <div id="bubble" role="status" aria-live="polite"></div>
      <div id="menu" role="menu" hidden>
        <div class="menu-page" id="menu-page-main">
          <button type="button" class="menu-item" id="menu-drink" role="menuitem">💧 Drink reminder<span id="menu-drink-check" class="check"></span></button>
          <button type="button" class="menu-item" id="menu-eat" role="menuitem">🍖 Eat reminder<span id="menu-eat-check" class="check"></span></button>
          <button type="button" class="menu-item" id="menu-mood" role="menuitem">😺 Mood<span id="menu-mood-value" class="check"></span></button>
          <button type="button" class="menu-item" id="menu-tasks" role="menuitem">📝 Tasks</button>
          <button type="button" class="menu-item" id="menu-settings" role="menuitem">⚙️ Settings</button>
          <div class="menu-sep"></div>
          <button type="button" class="menu-item danger" id="menu-exit" role="menuitem">Exit</button>
        </div>
        <div class="menu-page" id="menu-page-mood" hidden>
          <button type="button" class="menu-item" data-mood="normal">😌 Normal<span class="check"></span></button>
          <button type="button" class="menu-item" data-mood="happy">💗 Happy<span class="check"></span></button>
          <button type="button" class="menu-item" data-mood="sleepy">😴 Sleepy<span class="check"></span></button>
          <button type="button" class="menu-item" data-mood="grumpy">😾 Grumpy<span class="check"></span></button>
          <button type="button" class="menu-item" data-mood="sad">😢 Sad<span class="check"></span></button>
          <div class="menu-sep"></div>
          <button type="button" class="menu-item" id="menu-mood-back" role="menuitem">← Back</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
