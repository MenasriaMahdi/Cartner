<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartner Tasks</title>
    <link rel="stylesheet" href="/src/tasks.css" />
  </head>
  <body>
    <div class="widget">
      <header class="widget-head" id="widget-head">
        <span class="widget-title">🐱 Tasks</span>
        <button type="button" id="widget-close" title="Close">✕</button>
      </header>
      <main class="panel">
        <form id="task-form" class="composer" autocomplete="off">
          <input type="text" id="task-title" placeholder="What should Cartner remind you about?" maxlength="120" />
          <div class="composer-row">
            <input type="datetime-local" id="task-due" title="Optional time" />
            <button type="submit" class="primary" title="Add task">➕</button>
          </div>
        </form>
        <p id="task-empty" class="empty">No tasks yet. Cartner is napping 😴</p>
        <ul id="task-list"></ul>
        <p class="hint">Give a task a time and Cartner will remind you right on time 🐾</p>
      </main>
    </div>
    <script type="module" src="/src/main-tasks.ts"></script>
  </body>
</html>
